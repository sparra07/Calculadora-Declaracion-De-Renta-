<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Cálculo</title>
</head>
<body style="background-color: #f4f6f9; font-family: Arial, sans-serif; padding: 30px;">
    <h1 style="color: #333; text-align: center;">Modificar Registro de Cálculo</h1>
    <hr style="max-width: 500px; margin: 20px auto;">
    
    <div style="background-color: white; padding: 25px; border-radius: 5px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <form action="/actualizar_calculo" method="GET">
            <input type="hidden" name="id_calculo" value="{{ calculo.id_calculo }}">
            <input type="hidden" name="cedula_usuario" value="{{ calculo.cedula_usuario }}">
            
            <p style="font-size: 15px; background-color: #e9ecef; padding: 8px; border-radius: 4px;"><strong>Modificando Registro ID:</strong> #{{ calculo.id_calculo }} (Cédula: {{ calculo.cedula_usuario }})</p>
            <br>
            <label style="font-weight: bold; color: #555;">Ingreso Bruto:</label><br><input type="text" name="income_bruto" value="{{ calculo.income_bruto }}" required style="width: 95%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"><br><br>
            <label style="font-weight: bold; color: #555;">Aportes Ley:</label><br><input type="text" name="aportes_ley" value="{{ calculo.aportes_ley }}" required style="width: 95%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"><br><br>
            <label style="font-weight: bold; color: #555;">Deducciones:</label><br><input type="text" name="deducciones" value="{{ calculo.deducciones }}" required style="width: 95%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"><br><br>
            <label style="font-weight: bold; color: #555;">Renta Líquida:</label><br><input type="text" name="renta_liquida" value="{{ calculo.renta_liquida }}" required style="width: 95%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"><br><br>
            <label style="font-weight: bold; color: #555;">Fecha Creación:</label><br><input type="date" name="fecha_creacion" value="{{ calculo.fecha_creacion }}" required style="width: 95%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"><br><br>
            <button type="submit" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">Actualizar Cálculo</button>
        </form>
        <br>
        <p style="text-align: center; margin: 0;"><a href="/calculos" style="color: #dc3545; text-decoration: none;">Cancelar y regresar</a></p>
    </div>
</body>
</html>
