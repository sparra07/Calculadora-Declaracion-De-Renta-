<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Cálculos</title>
</head>
<body style="background-color: #f4f6f9; font-family: Arial, sans-serif; padding: 30px;">
    <h1 style="color: #333; text-align: center;">Historial de Cálculos para el Usuario</h1>
    <hr style="max-width: 800px; margin: 20px auto;">
    
    <div style="background-color: white; padding: 20px; border-radius: 5px; max-width: 900px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto;">
        <table border="0" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #28a745; color: white;">
                    <th style="border-bottom: 2px solid #ddd; text-align: center;">ID Cálculo</th>
                    <th style="border-bottom: 2px solid #ddd; text-align: center;">Ingreso Bruto</th>
                    <th style="border-bottom: 2px solid #ddd; text-align: center;">Aportes Ley</th>
                    <th style="border-bottom: 2px solid #ddd; text-align: center;">Deducciones</th>
                    <th style="border-bottom: 2px solid #ddd; text-align: center;">Fecha</th>

                </tr>
            </thead>
            <tbody>
                {% for c in calculos %}
                <tr style="border-bottom: 1px solid #eee; text-align: center;">
                    <td>{{ c.id_calculo }}</td>
                    <td>{{ c.income_bruto }}</td>
                    <td>{{ c.aportes_ley }}</td>
                    <td>{{ c.deducciones }}</td>
                    <td>{{ c.fecha_creacion }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <p style="text-align: center; margin-top: 30px;"><a href="/" style="color: #333; text-decoration: none; font-weight: bold;"> Volver al inicio</a></p>
</body>
</html>
